<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<title>CHOtv</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* ===== VIDEO WRAPPER ===== */
.video-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100vw;
  height: 100vh;
}

.video-play {
  position: relative;
  width: min(100vw, 100vh * 16 / 9);
  height: min(100vh, 100vw * 9 / 16);
  overflow: hidden;
}

.iframe-wrapper iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* ===== SOUND BUTTON ===== */
.sound-btn {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.6);
  border-radius: 50%;
  width: 56px;
  height: 56px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.2s ease;
}

.sound-btn:hover {
  transform: translateY(-50%) scale(1.1);
}

.sound-btn svg {
  width: 26px;
  height: 26px;
  fill: white;
}
</style>
</head>

<body>

<div class="video-wrapper">
  <div class="video-play">

    <div class="iframe-wrapper">
      <iframe id="player"
        src="https://www.youtube.com/embed/videoseries?list=PLDHs-YdooiNkFokGN6uEYzgAmCT0RuQ15&autoplay=1&mute=1&controls=0&loop=1&playlist=PLDHs-YdooiNkFokGN6uEYzgAmCT0RuQ15"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>

    <!-- SOUND BUTTON -->
    <div class="sound-btn" id="soundToggle">
      <svg id="icon" viewBox="0 0 24 24">
        <path id="icon-path"></path>
      </svg>
    </div>

  </div>
</div>

<script>
// ===== SVG PATHS =====
const ICON_ON = "M3 10v4h4l5 5V5L7 10H3zm10.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.74 2.5-2.26 2.5-4zm2.5 0c0 2.73-1.64 5.06-4 6.05v-2.19c1.19-.82 2-2.2 2-3.86s-.81-3.04-2-3.86V5.95c2.36.99 4 3.32 4 6.05z";
const ICON_OFF = "M16.5 12l3.5 3.5-1.5 1.5L15 13.5l-3.5 3.5-1.5-1.5L13.5 12 10 8.5l1.5-1.5L15 10.5l3.5-3.5 1.5 1.5L16.5 12z M3 10v4h4l5 5V5L7 10H3z";

const iconPath = document.getElementById("icon-path");
const soundToggle = document.getElementById("soundToggle");

let muted = true;
iconPath.setAttribute("d", ICON_OFF);

// ===== TOGGLE SOUND =====
soundToggle.addEventListener("click", () => {
  const iframe = document.getElementById("player");
  iframe.contentWindow.postMessage(JSON.stringify({
    event: "command",
    func: muted ? "unMute" : "mute",
    args: []
  }), "*");

  muted = !muted;
  iconPath.setAttribute("d", muted ? ICON_OFF : ICON_ON);
});

// ===== SHOW / HIDE BUTTON =====
let hideTimeout;

function showButtonTemporarily() {
  soundToggle.style.opacity = "1";
  clearTimeout(hideTimeout);
  hideTimeout = setTimeout(() => {
    soundToggle.style.opacity = "0";
  }, 2500);
}

function forceShowButton() {
  soundToggle.style.transition = "none";
  soundToggle.style.opacity = "1";
  soundToggle.offsetHeight;
  soundToggle.style.transition = "opacity 0.3s ease, transform 0.2s ease";
  showButtonTemporarily();
}

document.addEventListener("mousemove", forceShowButton);
document.addEventListener("touchstart", forceShowButton);
</script>

</body>
</html>
