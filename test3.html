<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<title>CHOtv</title>
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

<style>
body {
  margin: 0;
  padding: 0;
  background: #000;
  font-family: Palatino, serif;
}

@font-face {
  font-family: "twc";
  src: url("twcenmt.ttf");
}

.video-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100vw;
  height: 100vh;
}

.video-play {
  position: relative;
  width: min(100vw, 100vh * 16 / 9);
  height: min(100vh, 100vw * 9 / 16);
  overflow: hidden;
}

.iframe-wrapper {
  width: 100%;
  height: 100%;
}

.iframe-wrapper iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* ===== SLIDER WRAPPER ===== */
.slider {
  position: absolute;
  bottom: 5%;
  max-width: 95%;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  height: auto;
  opacity: 0;
  animation: show 1s ease forwards;
  animation-delay: 0.75s;
}

.slider img {
  max-width: 100%;
  height: auto;
  display: block;
}

.time {
  color: #000;
  font-weight: bold;
  font-family: twc;
  position: absolute;
  left: 78.8%;
  bottom: 6.5%;
}

@keyframes show {
  to { opacity: 1; }
}

/* ===== SOUND BUTTON ===== */
.sound-btn {
  position: absolute;
  left: 2%;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  background: rgba(0,0,0,0.6);
  border: 2px solid #fff;
  padding: 10px;
  cursor: pointer;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.2s ease;
}

.sound-btn .icon {
  width: 26px;
  height: 26px;
  stroke: #fff;
  fill: none;                 /* ❗ žádný fill = není šišatá */
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
</style>
</head>

<body onload="startTime()">

<div class="video-wrapper">
  <div class="video-play">

    <div class="iframe-wrapper">
      <iframe
        id="ytplayer"
        src="https://www.youtube.com/embed/videoseries?list=PLDHs-YdooiNkFokGN6uEYzgAmCT0RuQ15&autoplay=1&mute=1&controls=0&loop=1&playlist=PLDHs-YdooiNkFokGN6uEYzgAmCT0RuQ15&enablejsapi=1"
        title="YouTube video player"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <!-- SOUND BUTTON -->
    <button id="soundToggle" class="sound-btn">
      <!-- start = muted -->
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        <line x1="16" y1="8" x2="22" y2="16"/>
        <line x1="22" y1="8" x2="16" y2="16"/>
      </svg>
    </button>

    <!-- SLIDER -->
    <div class="slider">
      <img id="daily-gif" src="" alt="Dnešní GIF">
      <div class="time" id="txt"></div>
    </div>

  </div>
</div>

<script>
function startTime() {
  const today = new Date();
  let h = today.getHours();
  let m = today.getMinutes();
  m = m < 10 ? "0" + m : m;
  document.getElementById("txt").innerHTML = h + ":" + m;
  setTimeout(startTime, 500);
}

// === GIF podle data ===
(function () {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,'0');
  const d = String(today.getDate()).padStart(2,'0');
  const src = `gifs/gif_${y}-${m}-${d}.gif`;

  const img = document.getElementById("daily-gif");
  img.onerror = () => img.src = "gifs/default.gif";
  img.src = src;
})();
</script>

<script>
function resizeTimeToGif() {
  const img = document.getElementById("daily-gif");
  const time = document.getElementById("txt");

  if (!img.complete || img.naturalWidth === 0) return;

  const gifWidth = img.clientWidth;
  const fontSize = gifWidth * 0.025;
  time.style.fontSize = fontSize + "px";
}

document.getElementById("daily-gif").addEventListener("load", resizeTimeToGif);
window.addEventListener("resize", resizeTimeToGif);
</script>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let isMuted = true;
let hideTimeout;

const soundOnIcon = `
<svg viewBox="0 0 24 24" class="icon">
  <path d="M3 9v6h4l5 5V4L7 9H3z"/>
  <path d="M14.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/>
  <path d="M16.5 12c0-2.97-1.63-5.55-4-6.92v2.18c1.2.94 2 2.38 2 3.74s-.8 2.8-2 3.74v2.18c2.37-1.37 4-3.95 4-6.92z"/>
</svg>`;

const soundOffIcon = `
<svg viewBox="0 0 24 24" class="icon">
  <path d="M3 9v6h4l5 5V4L7 9H3z"/>
  <line x1="16" y1="8" x2="22" y2="16"/>
  <line x1="22" y1="8" x2="16" y2="16"/>
</svg>`;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('ytplayer', {
    events: {
      onReady: (e) => {
        e.target.mute();
      }
    }
  });
}

const soundToggle = document.getElementById("soundToggle");

function showButtonTemporarily() {
  soundToggle.style.opacity = "1";
  clearTimeout(hideTimeout);
  hideTimeout = setTimeout(() => {
    soundToggle.style.opacity = "0";
  }, 2500);
}

document.addEventListener("mousemove", showButtonTemporarily);
document.addEventListener("touchstart", showButtonTemporarily);

soundToggle.addEventListener("click", () => {
  if (!player) return;
  showButtonTemporarily();

  if (isMuted) {
    player.unMute();
    player.setVolume(100);
    isMuted = false;
    soundToggle.innerHTML = soundOnIcon;
  } else {
    player.mute();
    isMuted = true;
    soundToggle.innerHTML = soundOffIcon;
  }
});
</script>

</body>
</html>
